<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Read Aloud</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="container">
    <h1 class="title">READ ALOUD</h1>

    <div id="selectionBox" class="selection-box">
      <p id="selectionText" class="placeholder">NO TEXT SELECTED. HIGHLIGHT TEXT ON THE PAGE, THEN REOPEN THIS POPUP.</p>
    </div>

    <div id="errorBox" class="error-box hidden"></div>

    <div class="controls">
      <button id="playBtn" class="btn btn-play" disabled>▶ PLAY</button>
      <button id="pauseBtn" class="btn btn-pause" disabled>❚❚ PAUSE</button>
      <button id="stopBtn" class="btn btn-stop" disabled>■ STOP</button>
    </div>

    <div id="loading" class="loading hidden">LOADING<span class="dots"></span></div>

    <audio id="audioPlayer" preload="none"></audio>

    <div class="footer">
      <a href="#" id="optionsLink">SET API KEY</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
